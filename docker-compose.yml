# Nombre fijo del proyecto: los contenedores 'tests' y 'experimentos' controlan los demás
# servicios con `docker compose`, y necesitan apuntar exactamente al mismo proyecto.
name: integracion-sistemas-t1

services:
  # Se ejecuta también en un clon sin .env. Nunca publica puertos ni secretos.
  inicializar:
    build:
      context: .
      dockerfile: bootstrap/Dockerfile
    restart: "no"
    environment:
      MATRICULAS_DB_PASSWORD: ${MATRICULAS_DB_PASSWORD:-}
      MATRICULAS_API_KEYS: ${MATRICULAS_API_KEYS:-}
      MATRICULAS_JWT_SECRET: ${MATRICULAS_JWT_SECRET:-}
      ORCHESTRATOR_API_KEY: ${ORCHESTRATOR_API_KEY:-}
      INTERNAL_KEY: ${INTERNAL_KEY:-}
      INSCRIPCION_WRITER_KEY: ${INSCRIPCION_WRITER_KEY:-}
      PAGOS_API_KEY: ${PAGOS_API_KEY:-}
      PAGOS_CALLBACK_KEY: ${PAGOS_CALLBACK_KEY:-}
      MATRICULAS_DB_USER: ${MATRICULAS_DB_USER:-matriculas_user}
      MATRICULAS_DB_NAME: ${MATRICULAS_DB_NAME:-matriculas_db}
    volumes:
      - secretos_data:/state
      - config_db:/config/db
      - config_api:/config/api
      - config_orquestador:/config/orquestador
      - config_pagos:/config/pagos
      - config_gateway:/config/gateway
      - config_legacy:/config/legacy
      - config_runner:/config/runner

  cupos:
    build:
      context: .                    # raíz del servicio cupos
      dockerfile: cupos/Dockerfile
    restart: unless-stopped         # si Cupos cae por un error, vuelve solo (antes no tenia restart)
    environment:
      DB_PATH: /data/cupos.db
      SIMULAR_LATENCIA_MS: ${SIMULAR_LATENCIA_MS:-0}  # latencia artificial para pruebas/experimentos
      SIMULAR_LATENCIA_MODO: ${SIMULAR_LATENCIA_MODO:-antes}   # antes | despues (ver experiment/README.md)
      IDEMPOTENCIA_RETENCION_DIAS: ${IDEMPOTENCIA_RETENCION_DIAS:-0}
    volumes:
      - cupos_data:/data            # BD propia del servicio (T5)
    expose:
      - "50051"                     # solo visible para otros servicios del compose (red interna)
    # Sin `ports:` a propósito: el gRPC de Cupos es interno y no se publica en el host.
    # Para las pruebas de contrato se publica solo en 127.0.0.1 (docker-compose.test.yml).
    healthcheck:
      # El canal gRPC debe poder conectarse; así la API solo arranca cuando Cupos está listo.
      test: ["CMD", "python", "-c", "import grpc; ch = grpc.insecure_channel('localhost:50051'); grpc.channel_ready_future(ch).result(timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  matriculas-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${MATRICULAS_DB_NAME:-matriculas_db}
      POSTGRES_USER: ${MATRICULAS_DB_USER:-matriculas_user}
      POSTGRES_PASSWORD_FILE: /run/config/password
    volumes:
      - config_db:/run/config:ro
      - matriculas_db_data:/var/lib/postgresql/data   # BD propia del servicio (T5), igual que cupos_data
    depends_on:
      inicializar:
        condition: service_completed_successfully
    expose:
      - "5432"                      # solo visible para otros servicios del compose
    # Sin `ports:`: la base contiene datos personales y no debe ser accesible desde fuera del
    # compose. Para inspeccionarla: docker compose exec matriculas-db psql -U matriculas_user -d matriculas_db
    healthcheck:
      test: ["CMD-SHELL", 'PGCONNECT_TIMEOUT=3 PGPASSWORD="$$(cat "$$POSTGRES_PASSWORD_FILE")" psql -X -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -Atqc "SELECT 1" >/dev/null']
      interval: 5s
      timeout: 5s
      retries: 10

  matriculas:
    build:
      context: .                    # raíz del monorepo, igual que cupos
      dockerfile: matriculas/Dockerfile
    restart: "no"                   # no es un servidor: corre una vez y termina (ver README)
    stdin_open: true                # necesario: matriculas es un CLI interactivo
    tty: true
    environment:
      SERVICE_ENV_FILE: /run/config/env.json
      NODE_OPTIONS: --require /usr/src/app/cargar_env.cjs
      DB_HOST: matriculas-db
      DB_PORT: 5432
      DB_NAME: ${MATRICULAS_DB_NAME:-matriculas_db}
      DB_USER: ${MATRICULAS_DB_USER:-matriculas_user}
      DB_PASSWORD: ${MATRICULAS_DB_PASSWORD:-}
    volumes:
      - config_legacy:/run/config:ro
    depends_on:
      inicializar:
        condition: service_completed_successfully
      matriculas-db:
        condition: service_healthy
    profiles: ["legacy"]            # CLI "antes de la integración" (ver README) - no se levanta por defecto

  # Servicio interno de Inscripción. Las consultas de cursos leen Cupos.
  matriculas-api:
    build:
      context: .                    # raíz del monorepo, igual que los demás (necesita proto/)
      dockerfile: matriculas-api/Dockerfile
    restart: unless-stopped
    environment:
      SERVICE_ENV_FILE: /run/config/env.json
      CUPOS_GRPC_TARGET: cupos:50051
      CUPOS_GRPC_TIMEOUT_SECONDS: ${CUPOS_GRPC_TIMEOUT_SECONDS:-2.0}
      CUPOS_CB_FAILURE_THRESHOLD: ${CUPOS_CB_FAILURE_THRESHOLD:-5}
      CUPOS_CB_RECOVERY_SECONDS: ${CUPOS_CB_RECOVERY_SECONDS:-15.0}
      # Si no hay .env, el inicializador entrega las claves por un volumen privado.
      INSCRIPCION_WRITER_KEY: ${INSCRIPCION_WRITER_KEY:-}
      INTERNAL_KEY: ${INTERNAL_KEY:-}
      API_KEYS: ${MATRICULAS_API_KEYS:-}
      JWT_SECRET: ${MATRICULAS_JWT_SECRET:-}
      JWT_TTL_MINUTES: ${MATRICULAS_JWT_TTL_MINUTES:-60}
      JWT_ISSUER: ${JWT_ISSUER:-matriculas-api-local}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-matriculas-api}
      STUDENT_KEY_TTL_DAYS: ${STUDENT_KEY_TTL_DAYS:-90}
      AUTH_FAIL_LIMIT: ${AUTH_FAIL_LIMIT:-20}
      AUTH_FAIL_WINDOW_SECONDS: ${AUTH_FAIL_WINDOW_SECONDS:-60}
      WRITE_RATE_LIMIT_PER_MINUTE: ${WRITE_RATE_LIMIT_PER_MINUTE:-60}
      CURSOS_CACHE_TTL_SECONDS: ${CURSOS_CACHE_TTL_SECONDS:-5}
      DOCS_ENABLED: ${DOCS_ENABLED:-true}      # false en produccion: no publicar /docs ni /openapi.json
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/v1/health', timeout=3).status == 200 else 1)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - config_api:/run/config:ro
    depends_on:
      inicializar:
        condition: service_completed_successfully
      matriculas-db:
        condition: service_healthy

  orquestador:
    build:
      context: .
      dockerfile: matriculas-api/Dockerfile
    command: ["uvicorn", "app.orchestrator_main:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
    environment:
      SERVICE_ENV_FILE: /run/config/env.json
      SAGA_DATABASE_URL: sqlite:////data/sagas.db
      ORCHESTRATOR_API_KEY: ${ORCHESTRATOR_API_KEY:-}
      SERVICE_API_KEY: ${MATRICULAS_API_KEYS:-}
      INSCRIPCION_WRITER_KEY: ${INSCRIPCION_WRITER_KEY:-}
      INTERNAL_KEY: ${INTERNAL_KEY:-}
      INSCRIPCION_URL: http://matriculas-api:8000
      PAGOS_URL: ${PAGOS_URL:-http://pagos:8000}
      # Credencial PROPIA de Pagos (antes se enviaba la clave admin de Inscripción) y clave de sus avisos.
      PAGOS_API_KEY: ${PAGOS_API_KEY:-}
      PAGOS_CALLBACK_KEY: ${PAGOS_CALLBACK_KEY:-}
      SAGA_PAGO_POLL_SECONDS: ${SAGA_PAGO_POLL_SECONDS:-15}
      SAGA_PAGO_GRACIA_SECONDS: ${SAGA_PAGO_GRACIA_SECONDS:-60}
      CUPOS_GRPC_TARGET: cupos:50051
      SAGA_STALE_SECONDS: ${SAGA_STALE_SECONDS:-60}
      SAGA_RECONCILE_SECONDS: ${SAGA_RECONCILE_SECONDS:-10}
      SAGA_TIMEOUT_SECONDS: ${SAGA_TIMEOUT_SECONDS:-2}
      SAGA_RETRIES: ${SAGA_RETRIES:-3}
      SAGA_BACKOFF_SECONDS: ${SAGA_BACKOFF_SECONDS:-0.1}
      SAGA_BULKHEAD: ${SAGA_BULKHEAD:-8}
      SAGA_CB_THRESHOLD: ${SAGA_CB_THRESHOLD:-5}
      SAGA_CB_RECOVERY_SECONDS: ${SAGA_CB_RECOVERY_SECONDS:-15}
    volumes:
      - config_orquestador:/run/config:ro
      - sagas_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      inicializar:
        condition: service_completed_successfully
      cupos:
        condition: service_healthy
      matriculas-api:
        condition: service_healthy
      pagos:
        condition: service_healthy

  # Pagos: cobro con Transbank Webpay Plus (ambiente de integración gratuito por defecto).
  # Base propia (SQLite en pagos_data). Solo el gateway expone sus dos rutas de comprador.
  pagos:
    build:
      context: .
      dockerfile: pagos/Dockerfile
    restart: unless-stopped
    environment:
      SERVICE_ENV_FILE: /run/config/env.json
      DATABASE_URL: sqlite:////data/pagos.db
      PAGOS_API_KEY: ${PAGOS_API_KEY:-}
      PAGOS_CALLBACK_KEY: ${PAGOS_CALLBACK_KEY:-}
      INTERNAL_KEY: ${INTERNAL_KEY:-}
      ORQUESTADOR_URL: http://orquestador:8000
      PAGOS_PUBLIC_BASE_URL: ${PAGOS_PUBLIC_BASE_URL:-http://localhost:8000}
      TBK_BASE_URL: ${TBK_BASE_URL:-https://webpay3gint.transbank.cl}
      TBK_COMMERCE_CODE: ${TBK_COMMERCE_CODE:-597055555532}
      TBK_API_KEY: ${TBK_API_KEY:-579B532A7440BB0C9079DED94D31EA1615BACEB56610332264630D42D0A36B1C}
      TBK_TIMEOUT_SECONDS: ${TBK_TIMEOUT_SECONDS:-1.5}
      PAGOS_TTL_SECONDS: ${PAGOS_TTL_SECONDS:-600}
      PAGOS_CB_THRESHOLD: ${PAGOS_CB_THRESHOLD:-5}
      PAGOS_CB_RECOVERY_SECONDS: ${PAGOS_CB_RECOVERY_SECONDS:-15}
      PAGOS_BULKHEAD: ${PAGOS_BULKHEAD:-8}
    volumes:
      - config_pagos:/run/config:ro
      - pagos_data:/data            # BD propia del servicio
    depends_on:
      inicializar:
        condition: service_completed_successfully
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/v1/health', timeout=3).status == 200 else 1)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # Backend for frontend: compone cursos + matrículas para el portal web.
  bff:
    build:
      context: .
      dockerfile: bff/Dockerfile
    restart: unless-stopped
    environment:
      INSCRIPCION_SERVICE_URL: http://matriculas-api:8000
      CUPOS_GRPC_TARGET: cupos:50051
      BFF_UPSTREAM_TIMEOUT_SECONDS: ${BFF_UPSTREAM_TIMEOUT_SECONDS:-4}
      BFF_MAX_WORKERS: ${BFF_MAX_WORKERS:-16}
    expose:
      - "8090"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    depends_on:
      cupos:
        condition: service_healthy
      matriculas-api:
        condition: service_healthy

  # Único punto de entrada publicado: verifica JWT/API keys y limita por identidad.
  gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    restart: unless-stopped
    environment:
      SERVICE_ENV_FILE: /run/config/env.json
      INSCRIPCION_SERVICE_URL: http://matriculas-api:8000
      ORCHESTRATOR_SERVICE_URL: http://orquestador:8000
      PAGOS_SERVICE_URL: http://pagos:8000   # solo las rutas públicas del comprador (retorno de Webpay)
      BFF_SERVICE_URL: http://bff:8090
      MATRICULAS_API_KEYS: ${MATRICULAS_API_KEYS:-}
      MATRICULAS_JWT_SECRET: ${MATRICULAS_JWT_SECRET:-}
      JWT_ISSUER: ${JWT_ISSUER:-matriculas-api-local}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-matriculas-api}
      ORCHESTRATOR_API_KEY: ${ORCHESTRATOR_API_KEY:-}
      GATEWAY_RATE_LIMIT: ${GATEWAY_RATE_LIMIT:-120}
      GATEWAY_RATE_WINDOW_SECONDS: ${GATEWAY_RATE_WINDOW_SECONDS:-60}
      GATEWAY_PROXY_TIMEOUT_SECONDS: ${GATEWAY_PROXY_TIMEOUT_SECONDS:-30}
    ports:
      - "${API_BIND:-127.0.0.1}:8000:8080"
    volumes:
      - config_gateway:/run/config:ro
    depends_on:
      inicializar:
        condition: service_completed_successfully
      matriculas-api:
        condition: service_healthy
      orquestador:
        condition: service_healthy
      pagos:
        condition: service_healthy
      bff:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Ejecutores automáticos (no se levantan con `docker compose up`; solo con `run`)
  # ---------------------------------------------------------------------------
  # Pruebas:        docker compose run --rm --build tests [--rapido] [--reset-estado]
  # Experimentos:   docker compose run --rm --build experimentos [--reps 3] [--rapido]
  tests:
    profiles: ["tests"]
    build:
      context: .
      dockerfile: runner/Dockerfile
    working_dir: /repo
    entrypoint: ["python", "scripts/service_env.py", "python", "scripts/ejecutar_tests.py"]
    environment:
      SERVICE_ENV_FILE: /run/config/env.json
      INSCRIPCION_WRITER_KEY: ${INSCRIPCION_WRITER_KEY:-}
      COMPOSE_ARGS: "-f docker-compose.yml"      # sin el override que publica puertos en el host
      MATRICULAS_API_KEYS: ${MATRICULAS_API_KEYS:-}
      # 0 por defecto: borrar volumenes ELIMINA los datos del sistema. Solo con --reset-estado
      # (o RESET_ESTADO=1) y unicamente en una maquina donde no haya datos que conservar.
      RESET_ESTADO: ${RESET_ESTADO:-0}
    volumes:
      - config_runner:/run/config:ro
      - .:/repo
      # ATENCION: el socket de Docker equivale a root en el anfitrion. Solo se monta en estos
      # ejecutores (profiles `tests` y `experimentos`, que nunca arrancan con `docker compose up`)
      # porque las pruebas de falla y los experimentos apagan/recrean contenedores.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      inicializar:
        condition: service_completed_successfully
      matriculas-api:
        condition: service_healthy
      cupos:
        condition: service_healthy

  experimentos:
    profiles: ["experimentos"]
    build:
      context: .
      dockerfile: runner/Dockerfile
    working_dir: /repo
    entrypoint: ["python", "scripts/service_env.py", "python", "experiment/ejecutar_todo.py"]
    environment:
      SERVICE_ENV_FILE: /run/config/env.json
      COMPOSE_ARGS: ""
      API_KEY: ${MATRICULAS_API_KEYS:-}
    volumes:
      - config_runner:/run/config:ro
      - .:/repo
      # ATENCION: el socket de Docker equivale a root en el anfitrion. Solo se monta en estos
      # ejecutores (profiles `tests` y `experimentos`, que nunca arrancan con `docker compose up`)
      # porque las pruebas de falla y los experimentos apagan/recrean contenedores.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      inicializar:
        condition: service_completed_successfully
      matriculas-api:
        condition: service_healthy

volumes:
  sagas_data:
  pagos_data:
  cupos_data:
  matriculas_db_data:
  secretos_data:
  config_db:
  config_api:
  config_orquestador:
  config_pagos:
  config_gateway:
  config_legacy:
  config_runner:
