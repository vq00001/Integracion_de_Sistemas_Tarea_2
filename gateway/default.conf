server {
    listen 80;
    location ^~ /internal { return 404; }
    location = /v1/matriculas { proxy_pass http://orquestador:8000; proxy_read_timeout 30s; }
    location ^~ /v1/sagas/ { proxy_pass http://orquestador:8000; }
    location = /metrics { proxy_pass http://orquestador:8000; }
    location / { proxy_pass http://matriculas-api:8000; }
}
