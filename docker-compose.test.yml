# Override para tests: publica el puerto gRPC de Cupos SOLO en el loopback del host
# (127.0.0.1), nunca en todas las interfaces.
services:
  cupos:
    ports:
      - "127.0.0.1:50051:50051"

  # Solo en pruebas, para preparar inscripciones con la clave de escritura.
  matriculas-api:
    ports:
      - "127.0.0.1:8001:8000"
